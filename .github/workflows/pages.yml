name: Deploy Cockpit to GitHub Pages

on:
  push:
    branches:
      - claude/intelligent-bardeen-015j3v
    paths:
      - 'cockpit-data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site
        run: |
          set -e
          mkdir -p _site/cockpit-data
          cp cockpit-data/*.html _site/cockpit-data/ 2>/dev/null || true
          cp cockpit-data/*.csv _site/cockpit-data/ 2>/dev/null || true
          cp cockpit-data/*.xlsx _site/cockpit-data/ 2>/dev/null || true

          latest=$(ls _site/cockpit-data/cockpit-*.html 2>/dev/null | sort | tail -n 1 | xargs -n1 basename)
          if [ -z "$latest" ]; then
            echo "No cockpit-*.html files found in cockpit-data/" >&2
            exit 1
          fi
          echo "Latest edition: $latest"

          cat > _site/cockpit-data/latest.html <<HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./${latest}">
            <title>Industry Intelligence Cockpit — Latest Edition</title>
          </head>
          <body style="font-family:Inter,Arial,sans-serif;background:#F7F8FA;color:#00294D;padding:40px;">
            <p>Redirecting to the latest edition&hellip; If you are not redirected, <a href="./${latest}">click here</a>.</p>
          </body>
          </html>
          HTMLEOF

          cat > _site/index.html <<HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./cockpit-data/latest.html">
            <title>Industry Intelligence Cockpit</title>
          </head>
          <body style="font-family:Inter,Arial,sans-serif;background:#F7F8FA;color:#00294D;padding:40px;">
            <p>Redirecting to the latest edition&hellip; If you are not redirected, <a href="./cockpit-data/latest.html">click here</a>.</p>
          </body>
          </html>
          HTMLEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
